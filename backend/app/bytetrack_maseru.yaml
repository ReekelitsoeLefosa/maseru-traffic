# ByteTrack tuned for wide, high-mounted junction cameras (small, distant vehicles).
# Thresholds are lowered to match DETECT_CONF=0.2 so faint detections still start tracks.
tracker_type: bytetrack
track_high_thresh: 0.2
track_low_thresh: 0.1
new_track_thresh: 0.2
track_buffer: 60     # keep tracks through trees/poles and frame skipping (FRAME_STRIDE)
match_thresh: 0.8
fuse_score: True
