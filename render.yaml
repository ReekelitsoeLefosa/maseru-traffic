# Render blueprint: Render reads this file and creates the cloud server for you.
# Render dashboard -> New -> Blueprint -> pick this GitHub repository.
services:
  - type: web
    name: maseru-traffic
    runtime: python
    plan: free
    region: frankfurt            # closest Render region to Lesotho
    buildCommand: pip install -r deploy/requirements-server.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Free plan disks are wiped on every restart: keep data in a free Neon PostgreSQL database.
      - key: DATABASE_URL
        sync: false              # paste the Neon connection string when Render asks
      - key: STATION_KEY         # camera stations must send this key (copy it into the station's .env)
        generateValue: true
      - key: ADMIN_TOKEN         # open https://<your-app>.onrender.com/?admin=<this> once to unlock admin
        generateValue: true
      - key: PUBLIC_URL
        sync: false              # https://<your-app>.onrender.com
      - key: FCM_CREDENTIALS_JSON
        sync: false              # Firebase service-account key (whole JSON) for push notifications
      - key: SIMULATE_OTHER_INTERSECTIONS
        value: "true"
      # ---- messaging (set in the Render dashboard; "console" = only write messages to the log) ----
      - key: SMS_PROVIDER          # console | textbee | twilio
        sync: false
      - key: TEXTBEE_API_KEY       # textbee.dev dashboard -> API keys
        sync: false
      - key: TEXTBEE_WEBHOOK_SECRET
        sync: false
      - key: SMS_DAILY_LIMIT       # textbee free plan: 50/day
        value: "45"
      - key: WHATSAPP_PROVIDER     # console | meta | twilio
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM       # your Twilio number (+1...) or an approved sender name
        sync: false
      - key: META_WA_TOKEN         # permanent system-user token
        sync: false
      - key: META_WA_PHONE_NUMBER_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WA_VERIFY_TOKEN  # paste this into Meta's webhook "Verify token" box
        generateValue: true
